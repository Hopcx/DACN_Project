# T20: hệ thống DACN trên một VPS Linux — SQL Server + API + Caddy (FE tĩnh, HTTPS, reverse proxy).
# Chạy từ thư mục deploy/:  docker compose --env-file .env up -d --build   (hoặc ./deploy.sh)
# Bố cục mặc định trên VPS: hai repo đặt cạnh nhau, vd. /opt/dacn/DACN_Project và /opt/dacn/DACN_FE.
# Mọi secret nằm trong deploy/.env (không commit; mẫu: .env.example).
name: dacn

# Review T20 T8: giới hạn log Docker (Serilog ghi Console) để không đầy đĩa
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  sql:
    # Review T20 T12: ghim bằng MSSQL_IMAGE trong .env (digest deploy.sh in ra sau DEPLOY_OK) để rollback tái lập được
    image: ${MSSQL_IMAGE:-mcr.microsoft.com/mssql/server:2025-latest}
    logging: *logging
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: ${MSSQL_PID:-Express}
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Đặt MSSQL_SA_PASSWORD trong .env}
      MSSQL_MEMORY_LIMIT_MB: ${MSSQL_MEMORY_LIMIT_MB:-2048}
    volumes:
      - sql-data:/var/opt/mssql
    # KHÔNG mở cổng 1433 ra ngoài: chỉ API trong mạng nội bộ dùng
    networks: [dacn]
    healthcheck:
      # Review T20 N4: mật khẩu qua SQLCMDPASSWORD, không nằm trên dòng lệnh (ps của máy chủ thấy được)
      test: ["CMD-SHELL", "SQLCMDPASSWORD=\"$$MSSQL_SA_PASSWORD\" /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s

  api:
    build:
      context: ..
      dockerfile: deploy/api.Dockerfile
    image: dacn-api:${IMAGE_TAG:-latest}
    logging: *logging
    restart: unless-stopped
    depends_on:
      sql:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: "Server=sql,1433;Database=${DB_NAME:-ProjectDACN};User Id=${DB_APP_USER:-dacn_app};Password=${DB_APP_PASSWORD:?Đặt DB_APP_PASSWORD trong .env};Encrypt=True;TrustServerCertificate=True"
      JwtSettings__SecretKey: ${JWT_SECRET_KEY:?Đặt JWT_SECRET_KEY trong .env}
      Security__AllowedOrigins__0: ${PUBLIC_ORIGIN:?Đặt PUBLIC_ORIGIN (https://...) trong .env}
      Mail__PublicFrontendUrl: ${PUBLIC_ORIGIN}
      Mail__SmtpHost: ${SMTP_HOST:?Đặt SMTP_HOST trong .env}
      Mail__SmtpPort: ${SMTP_PORT:-587}
      Mail__EnableSsl: ${SMTP_ENABLE_SSL:-true}
      Mail__From: ${SMTP_FROM:?Đặt SMTP_FROM trong .env}
      Mail__SmtpUser: ${SMTP_USER:?Đặt SMTP_USER trong .env}
      Mail__SmtpPassword: ${SMTP_PASSWORD:?Đặt SMTP_PASSWORD trong .env}
      Media__RootPath: /var/lib/dacn/media
      Media__SigningKey: ${MEDIA_SIGNING_KEY:?Đặt MEDIA_SIGNING_KEY trong .env}
      # Chỉ tin X-Forwarded-* từ mạng Docker của compose này (Caddy)
      Proxy__Enabled: "true"
      Proxy__KnownNetworks__0: ${DOCKER_SUBNET:-172.28.0.0/16}
      # Review T20 N1: khóa DataProtection bền qua các lần tạo lại container (không thì deploy = đăng xuất mọi người)
      DataProtection__KeysPath: /var/lib/dacn/dp-keys
    volumes:
      - media:/var/lib/dacn/media
      - api-logs:/app/logs
      - dp-keys:/var/lib/dacn/dp-keys
    networks: [dacn]

  web:
    build:
      context: ${FE_PATH:-../../DACN_FE}
    image: dacn-web:${IMAGE_TAG:-latest}
    logging: *logging
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      SITE_HOST: ${SITE_HOST:?Đặt SITE_HOST (tên miền) trong .env}
      ACME_EMAIL: ${ACME_EMAIL:?Đặt ACME_EMAIL (email nhận thông báo chứng chỉ) trong .env}
      HSTS_MAX_AGE: ${HSTS_MAX_AGE:-31536000}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    networks: [dacn]

networks:
  dacn:
    ipam:
      config:
        - subnet: ${DOCKER_SUBNET:-172.28.0.0/16}

volumes:
  sql-data:
  media:
  api-logs:
  dp-keys:
  caddy-data:
  caddy-config:
